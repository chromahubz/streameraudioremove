EngineDescription="Select the AI engine for audio separation.\n• Sherpa-ONNX: Best for CPU-only systems (80ms latency)\n• HS-TasNet: Lowest latency with GPU (25ms latency)\n• ClearerVoice: Best speech clarity (50ms latency)\n• SpleeterRT: Highest quality separation (100ms latency)"

StrengthDescription="How much to isolate the voice.\n100% = Only isolated voice\n0% = Original audio (no processing)"

VideoDelayDescription="Video delay in milliseconds to compensate for audio processing latency.\nSet to 0 for automatic delay based on selected engine.\nIncrease this if you notice lip-sync issues (video ahead of audio)."

AutoDetectDescription="Automatically enable isolation only when background music is detected.\nReduces CPU usage when no music is present."
